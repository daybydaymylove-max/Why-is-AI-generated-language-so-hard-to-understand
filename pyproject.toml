[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligibility-linter"
version = "1.0.0"
authors = [
  { name="daybydaymylove-max" },
]
description = "Psycholinguistic intelligibility auditor and anti-compression decoupling toolkit based on arXiv:2610.29162v1."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
"Homepage" = "https://github.com/daybydaymylove-max/Why-is-AI-generated-language-so-hard-to-understand"
"Bug Tracker" = "https://github.com/daybydaymylove-max/Why-is-AI-generated-language-so-hard-to-understand/issues"
